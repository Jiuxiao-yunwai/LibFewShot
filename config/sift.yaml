# 引入基础配置模块
includes:
  - headers/data.yaml
  - headers/device.yaml
  - headers/misc.yaml
  - headers/model.yaml
  - headers/optimizer.yaml
  - classifiers/SIFT.yaml      # 引入 SIFT 分类器配置
  - backbones/resnet12.yaml  # 引入 ResNet12 骨干网络配置

# --- 覆盖默认配置 ---

# 数据集配置
data_root: /root/autodl-tmp/dataset01/miniImageNet--ravi
image_size: 84

# 模型配置
pretrain_path: /root/autodl-tmp/dataset01/checkpoints/mini_res12/max_acc.pth

# 少样本任务配置
way_num: 5
shot_num: 1 # 或 5
query_num: 15

backbone:
  name: resnet12
  kwargs:
    keep_prob: 0.0
    avg_pool: True
    is_flatten: True
    maxpool_last2: True

# 外层循环的优化器配置
optimizer:
  name: Adam
  kwargs:
    lr: 0.001

# Episode 配置
train_episode: 200
test_episode: 400
episode_size: 1 
epoch: 100
log_interval: 50

# 硬件配置
device_ids: 0
n_gpu: 1

classifier:
  name: SIFT
  kwargs:
    # --- 核心路径 ---
    # feat_dim 会被 backbone 的输出维度自动覆盖
    feat_dim: 640 
    # GloVe 词向量文件路径
    data_root: /root/autodl-tmp/dataset01/miniImageNet--ravi
    glove_path: /root/autodl-tmp/dataset01/glove.6B.50d.txt 
    # 预提取的基类特征将被自动保存/加载的路径
    pre_extract_path: /root/autodl-tmp/dataset01/miniImageNet_resnet12_base_features.npy

    # --- 特征生成超参数 (ns) ---
    # n_generated (ns): 每个新类要生成的特征数量
    n_generated: 20      

    # --- 语义转换 (ST) 生成器训练超参数 ---
    # st_iter (st): 训练迭代次数
    st_iter: 50
    # lr_st (lr): 学习率
    lr_st: 0.005  
    # dc_st (dc): 权重衰减 (L2正则化)
    dc_st: 0.01

    # --- 损失函数权重 ---
    # compactness_w: 紧凑性损失的权重
    compactness_w: 1.0    

    # --- 学习设置 ---
    # setting: 可选 'in' (inductive) 或 'tr' (transductive)
    setting: 'tr'

    # --- 最终分类器模式 ---
    # final_classifier: 可选 'LR', 'SVM', 'GD'
    # classifier_max_iter: 'LR' 或 'SVM' 的最大迭代次数
    final_classifier: 'LR'
    classifier_max_iter: 1000