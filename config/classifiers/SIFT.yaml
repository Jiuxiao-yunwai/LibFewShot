# SIFT 分类器配置文件
classifier:
  name: SIFT
  kwargs:
    # --- 核心路径 ---
    # feat_dim 会被 backbone 的输出维度自动覆盖
    feat_dim: 640 
    # GloVe 词向量文件路径
    glove_path: /root/autodl-tmp/dataset01/glove.6B.50d.txt 
    # 预提取的基类特征将被自动保存/加载的路径
    pre_extract_path: /root/autodl-tmp/dataset01/miniImageNet_resnet12_base_features.npy

    # --- 特征生成超参数 (ns) ---
    # n_generated (ns): 每个新类要生成的特征数量
    n_generated: 10      

    # --- 语义转换 (ST) 生成器训练超参数 ---
    # st_iter (st): 训练迭代次数
    st_iter: 50
    # lr_st (lr): 学习率
    lr_st: 0.005  
    # dc_st (dc): 权重衰减 (L2正则化)
    dc_st: 0.01

    # --- 损失函数权重 ---
    # compactness_w: 紧凑性损失的权重
    compactness_w: 1.0    

    # --- 学习设置 ---
    # setting: 可选 'in' (inductive) 或 'tr' (transductive)
    setting: 'tr'
    
    # --- 最终分类器模式 -- -
    # final_classifier: 可选 'LR', 'SVM', 'GD'
    # classifier_max_iter: 'LR' 或 'SVM' 的最大迭代次数
    final_classifier: 'LR'
    classifier_max_iter: 1000